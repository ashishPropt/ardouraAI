# =============================================================================
# ArdouraAI - Docker Compose  (Vultr deployment - Multi-Tenant)
# =============================================================================

x-common-env: &common-env
  env_file:
    - /opt/ardoura/.env

x-python-env: &python-env
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

services:

  # -- Dependency installer (runs once then exits) ----------------------------
  pip-installer:
    image: python:3.11-slim
    container_name: pip-installer
    working_dir: /app
    volumes:
      - /opt/ardoura:/app
      - pip-packages:/usr/local/lib/python3.11/site-packages
      - pip-bin:/usr/local/bin
    environment:
      PYTHONUNBUFFERED: "1"
    command: >-
      bash -c "
        echo '[pip-installer] Installing dependencies...' &&
        pip install --quiet -r requirements.txt &&
        echo '[pip-installer] Done!'
      "
    restart: on-failure

  # -- Zookeeper --------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk-data:/var/lib/zookeeper/data
      - zk-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -- Kafka ------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # -- Multi-tenant Flask webhook receiver ------------------------------------
  flask-producer:
    image: python:3.11-slim
    container_name: flask-producer
    restart: unless-stopped
    working_dir: /app
    volumes:
      - /opt/ardoura:/app
      - /etc/ardoura:/etc/ardoura
      - pip-packages:/usr/local/lib/python3.11/site-packages
      - pip-bin:/usr/local/bin
    <<: *common-env
    environment:
      <<: *python-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FLASK_PORT: "5000"
    command: python tenant/multitenant_producer.py
    ports:
      - "5000:5000"
    depends_on:
      kafka:
        condition: service_healthy
      pip-installer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # -- Multi-tenant Kafka consumer --------------------------------------------
  jira-consumer:
    image: python:3.11-slim
    container_name: jira-consumer
    restart: unless-stopped
    working_dir: /app
    volumes:
      - /opt/ardoura:/app
      - /etc/ardoura:/etc/ardoura
      - pip-packages:/usr/local/lib/python3.11/site-packages
      - pip-bin:/usr/local/bin
    <<: *common-env
    environment:
      <<: *python-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TENANT_REFRESH_INTERVAL: "60"
    command: python tenant/multitenant_consumer.py
    depends_on:
      kafka:
        condition: service_healthy
      pip-installer:
        condition: service_completed_successfully

  # -- Marketing website + signup form ----------------------------------------
  website:
    image: python:3.11-slim
    container_name: website
    restart: unless-stopped
    working_dir: /app
    volumes:
      - /opt/ardoura:/app
      - /etc/ardoura:/etc/ardoura
      - pip-packages:/usr/local/lib/python3.11/site-packages
      - pip-bin:/usr/local/bin
    <<: *common-env
    environment:
      <<: *python-env
      WEBSITE_PORT: "8080"
    command: python website/app.py
    ports:
      - "8080:8080"
    depends_on:
      pip-installer:
        condition: service_completed_successfully

  # -- Observability consumer -------------------------------------------------
  obs-consumer:
    image: python:3.11-slim
    container_name: obs-consumer
    restart: unless-stopped
    working_dir: /app
    volumes:
      - /opt/ardoura:/app
      - /etc/ardoura:/etc/ardoura
      - pip-packages:/usr/local/lib/python3.11/site-packages
      - pip-bin:/usr/local/bin
    <<: *common-env
    environment:
      <<: *python-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: python kafka_observability_consumer.py
    depends_on:
      kafka:
        condition: service_healthy
      pip-installer:
        condition: service_completed_successfully

volumes:
  zk-data:
  zk-log:
  kafka-data:
  pip-packages:
  pip-bin:
